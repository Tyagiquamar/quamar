  <!-- Arrow 1-2 -->
  <line x1="320" y1="88" x2="320" y2="112" stroke="#d97706" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <!-- Layer 2: Supabase Edge Functions -->
  <rect x="170" y="116" width="300" height="64" rx="10" stroke="#8b8b8b" stroke-width="1.5" fill="none"/>
